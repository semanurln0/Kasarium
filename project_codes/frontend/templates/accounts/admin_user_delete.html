{% extends "base.html" %}
{% block title %}Delete User — Kasarium{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:auto">
  <h2>Delete user</h2>
  <p>Delete <strong>{{ target.email }}</strong>? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-danger">Delete user</button>
    <a href="{% url 'accounts:admin_user_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
