{% extends "base.html" %}
{% block title %}Change Password — Kasarium{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:auto">
  <h2>Change password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save password</button>
    <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
