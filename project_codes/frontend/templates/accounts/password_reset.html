{% extends "base.html" %}
{% block title %}Reset Password — Kasarium{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:auto">
  <h2>Forgot password</h2>
  <p>Enter your email address and we will send a reset link.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Send reset email</button>
    <a href="{% url 'accounts:login' %}" class="btn btn-secondary">Back to login</a>
  </form>
</div>
{% endblock %}
