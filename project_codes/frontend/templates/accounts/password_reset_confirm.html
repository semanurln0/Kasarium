{% extends "base.html" %}
{% block title %}Set New Password — Kasarium{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:auto">
  <h2>Set a new password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
