{% extends "base.html" %}
{% block title %}Receipt Templates{% endblock %}
{% block content %}
<div class="card">
  <h2>Receipt Templates</h2>
  <a href="{% url 'pos:receipt_create' %}" class="btn btn-primary" style="margin-bottom:1rem;display:inline-block">+ New Template</a>
  <table>
    <thead><tr><th>Name</th><th>Width</th><th></th></tr></thead>
    <tbody>
    {% for t in templates %}
    <tr>
      <td>{{ t.name }}</td>
      <td>{{ t.paper_width }}mm</td>
      <td>
        <a href="{% url 'pos:receipt_preview' t.pk %}" class="btn btn-secondary">Preview</a>
        <a href="{% url 'pos:receipt_update' t.pk %}" class="btn btn-secondary">Edit</a>
        <a href="{% url 'pos:receipt_delete' t.pk %}" class="btn btn-danger">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No templates.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
