{% extends "base.html" %}
{% block title %}New Customer Message — Kasarium{% endblock %}
{% block content %}
<div class="card" style="max-width:760px">
  <a href="{% url 'shop:admin_message_list' %}" class="btn btn-secondary" style="margin-bottom:1rem">← Back to Messages</a>
  <h2>Send Message to Customer</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Send Message</button>
  </form>
</div>
{% endblock %}
